apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectpulse-web
  labels:
    app: projectpulse-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projectpulse-web
  template:
    metadata:
      labels:
        app: projectpulse-web
    spec:
      containers:
        - name: web
          image: projectpulse-web:latest
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "http://projectpulse.local/api"
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10